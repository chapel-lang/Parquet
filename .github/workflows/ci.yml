name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        version: [2.8.0, 2.9.0, latest]
    runs-on: ubuntu-latest
    container:
      image: chapel/chapel:${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install arrow/parquet dependencies
        run: |
          apt update
          apt install -y -V ca-certificates lsb-release wget
          wget https://packages.apache.org/artifactory/arrow/$(lsb_release --id --short | tr 'A-Z' 'a-z')/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb
          apt install -y -V ./apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb

          # this should be all thats required, but some OSes don't
          # have these by default, hence the above steps
          apt-get update
          apt-get install -y libarrow-dev libparquet-dev
      - name: Check the project builds
        run: |
          mason build
      - name: Check the examples build and run
        run: |
          if ls example/*.chpl >/dev/null 2>&1; then
            mason build --example
            for example in example/*.chpl; do
              mason run --example $(basename $example);
            done
          else
            echo "No examples found, skipping."
          fi
      - name: Run mason tests
        run: |
          mason test --show --parallel
  source-matrix:
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        shell: python
        run: |
          import json, os
          versions = ["2.8.0", "2.9.0", "latest"]
          comms = ["none", "gasnet-udp"]
          include = []
          for version in versions:
              # (backend, asan); clang backend and ASAN are only tested with latest
              # FIXME: ASAN only tested with gasnet, due to linux packages not supporting it yet
              for comm in comms:
                  configs = [("llvm", "false")]
                  if version == "latest":
                      configs.append(("clang", "false"))
                      if comm != "none":
                          configs.append(("clang", "true"))
                  for backend, asan in configs:
                      include.append({"version": version, "comm": comm,
                                      "backend": backend, "asan": asan})
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"include": include}) + "\n")
  build-arrow:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.key.outputs.cache-key }}
      cache-path: ${{ steps.key.outputs.cache-path }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine Arrow cache key
        id: key
        run: |
          ARROW_VERSION=$(sed -nE 's/^ARROW_VERSION=\$\{ARROW_VERSION:-"([^"]+)"\}/\1/p' build_arrow.sh)
          ARROW_SCRIPT_SHA=$(sha256sum build_arrow.sh | cut -d' ' -f1)
          echo "cache-key=arrow-${ARROW_VERSION}-${ARROW_SCRIPT_SHA}" >> $GITHUB_OUTPUT
          {
            echo "cache-path<<EOF"
            echo "deps/arrow-${ARROW_VERSION}"
            echo "arrow.sh"
            echo "EOF"
          } >> $GITHUB_OUTPUT
      - name: cache Arrow install
        id: cache-arrow
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: ${{ steps.key.outputs.cache-path }}
          key: ${{ steps.key.outputs.cache-key }}
      - name: Setup Chapel
        if: steps.cache-arrow.outputs.cache-hit != 'true'
        uses: jabraham17/setup-chpl@v1
        with:
          # version: latest
          version: 2.9.0 # pin to 2.9 for now
      - name: Build arrow/parquet dependencies (retrying)
        if: steps.cache-arrow.outputs.cache-hit != 'true'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 3
          timeout_seconds: 1200
          retry_wait_seconds: 60
          command: |
            NUM_CORES=$(nproc) ./build_arrow.sh
  tests-from-source:
    needs: [source-matrix, build-arrow]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source-matrix.outputs.matrix) }}
    name: tests-from-source with ${{ matrix.version }} (CHPL_COMM=${{ matrix.comm }}, CHPL_TARGET_COMPILER=${{ matrix.backend }}, ASAN=${{ matrix.asan }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Chapel
        uses: jabraham17/setup-chpl@v1
        with:
          version: ${{ matrix.version }}
          comm: ${{ matrix.comm }}
          backend: ${{ matrix.backend }}
      - name: Setup GASNet
        if: ${{ matrix.comm == 'gasnet-udp' }}
        run: |
          echo "GASNET_ROUTE_OUTPUT=0" >> $GITHUB_ENV
          echo "GASNET_QUIET=Y" >> $GITHUB_ENV
          echo "GASNET_SPAWNFN=L" >> $GITHUB_ENV
          echo "GASNET_MASTERIP=127.0.0.1" >> $GITHUB_ENV
          echo "GASNET_WORKERIP=127.0.0.0" >> $GITHUB_ENV
          echo "CHPL_RT_OVERSUBSCRIBED=yes" >> $GITHUB_ENV
      - name: Enable ASAN
        if: ${{ matrix.asan == 'true' }}
        run: |
          echo "CHPL_TARGET_MEM=cstdlib" >> $GITHUB_ENV
          echo "CHPL_SANITIZE_EXE=address" >> $GITHUB_ENV

          echo "ASAN_OPTIONS=use_sigaltstack=0,detect_leaks=0" >> $GITHUB_ENV
      - name: Check Chapel
        run: |
          chpl --version
          chpl --print-chpl-settings
      - name: Restore Arrow install from cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: ${{ needs.build-arrow.outputs.cache-path }}
          key: ${{ needs.build-arrow.outputs.cache-key }}
          fail-on-cache-miss: true
      - name: Check the project builds
        run: |
          . ./arrow.sh
          mason build
      - name: Check the examples build and run
        run: |
          . ./arrow.sh
          if ls example/*.chpl >/dev/null 2>&1; then
            mason build --example
            for example in example/*.chpl; do
              mason run --example $(basename $example);
            done
          else
            echo "No examples found, skipping."
          fi
      - name: Run mason tests
        run: |
          . ./arrow.sh
          mason test --show --parallel
      - name: Run multilocale tests
        if: ${{ matrix.comm != 'none' }}
        run: |
          . ./arrow.sh
          PARQUET_TEST_NUM_LOCALES=4 mason test --show
